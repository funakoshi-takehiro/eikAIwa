# GitHub Pages への公開。
#
# 経路はこれ**だけ**。Settings → Pages → Source を「GitHub Actions」にしておくこと。
# 「Deploy from a branch」にすると、ブランチ直下がそのまま配信され、
#   - precheck.py を通らずに公開される（唯一の防波堤が効かない）
#   - 下の許可リストが無視され、CLAUDE.md や .claude/ 配下まで配信される
#   - 2つの経路が同じ URL に同時デプロイし、後に終わったほうが勝つ
# 実測で /.claude/settings.json と /CLAUDE.md が 200 で読めていた。
#
# 配信するのは「アプリの実体だけ」。許可リスト方式にしてある。理由は下記。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # 配信するのは既定ブランチのときだけ。
    #
    # github-pages 環境は既定ブランチからのデプロイしか受け付けない。
    # 同じコミット e3af150 で実測した:
    #   既定ブランチから  → 成功
    #   それ以外から      → runner に載る前に失敗（ログすら残らない）
    # 条件を job に書いておけば、ブランチ名を並べる必要がなく、
    # 既定ブランチを変えてもワークフローを編集しなくてよい。
    # 対象外のブランチは赤い × ではなく「スキップ」になる。
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # サプライチェーン対策としてコミットSHAで固定（Dependabot が更新を自動PR）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 静的チェック（これを通らなければ公開しない）
        run: python3 tools/precheck.py

      # Pages は設定済みだが、enablement: true は残す。
      # 何かの拍子に Pages が無効に戻っても、このアクションが有効化を試みる。
      # （無料プランでは private だと有効化できず、ここで失敗する）
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # 除外側を並べる方式にしない。開発用ファイルを足すたびに除外の書き足しが
      # 要り、書き忘れがそのまま公開事故になる。許可リストなら書き忘れは
      # 「公開されない」側に倒れる（本番で 404 になって気づく）。
      # アプリに新しいディレクトリを足したら、下の cp に足すこと。
      - name: 公開するものだけを集める
        run: |
          set -e
          rm -rf _site && mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll _site/
          cp -r css js icons data _site/

          # 開発用が混ざっていないことを機械で確かめる
          for f in .claude CLAUDE.md README.md tools .github .gitignore .git; do
            if [ -e "_site/$f" ]; then
              echo "公開物に $f が混ざっています。上の cp を見直してください。" >&2
              exit 1
            fi
          done

          # 起動に要るものが欠けていないことも確かめる
          for f in index.html sw.js manifest.webmanifest js/base.js js/main.js \
                   css/style.css data/categories.json .nojekyll; do
            if [ ! -e "_site/$f" ]; then
              echo "公開物に $f がありません。" >&2
              exit 1
            fi
          done

          echo "公開するファイル数: $(find _site -type f | wc -l)"

      # include-hidden-files: true が要る。v5 は既定でドットで始まるものを
      # tar から外すため、上で「ある」と確かめた .nojekyll が成果物に入らない。
      # （v3 では入っていた。実測: v5 の tar 一覧に .nojekyll が無かった）
      # 検査したものと配信するものが食い違う状態は、それ自体が事故のもと。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
