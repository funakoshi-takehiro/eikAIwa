# GitHub Pages への公開。
#
# 経路はこれ**だけ**。Settings → Pages → Source を「GitHub Actions」にしておくこと。
# 「Deploy from a branch」にすると、ブランチ直下がそのまま配信され、
#   - precheck.py を通らずに公開される（唯一の防波堤が効かない）
#   - 下の許可リストが無視され、CLAUDE.md や .claude/ 配下まで配信される
#   - 2つの経路が同じ URL に同時デプロイし、後に終わったほうが勝つ
# 実測で /.claude/settings.json と /CLAUDE.md が 200 で読めていた。
#
# 配信するのは「アプリの実体だけ」。許可リスト方式にしてある。理由は下記。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/english-learning-app-plan-acnz6p
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # サプライチェーン対策としてコミットSHAで固定（Dependabot が更新を自動PR）
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 静的チェック（これを通らなければ公開しない）
        run: python3 tools/precheck.py

      # enablement: true にしておくと、Pages が未設定でもこのアクションが
      # 有効化を試みる。リポジトリを public にすれば、次の push で
      # Settings を触らずに公開が始まる。
      # （無料プランでは private のままだと有効化できず、ここで失敗する）
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      # 除外側を並べる方式にしない。開発用ファイルを足すたびに除外の書き足しが
      # 要り、書き忘れがそのまま公開事故になる。許可リストなら書き忘れは
      # 「公開されない」側に倒れる（本番で 404 になって気づく）。
      # アプリに新しいディレクトリを足したら、下の cp に足すこと。
      - name: 公開するものだけを集める
        run: |
          set -e
          rm -rf _site && mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll _site/
          cp -r css js icons data _site/

          # 開発用が混ざっていないことを機械で確かめる
          for f in .claude CLAUDE.md README.md tools .github .gitignore .git; do
            if [ -e "_site/$f" ]; then
              echo "公開物に $f が混ざっています。上の cp を見直してください。" >&2
              exit 1
            fi
          done

          # 起動に要るものが欠けていないことも確かめる
          for f in index.html sw.js manifest.webmanifest js/base.js js/main.js \
                   css/style.css data/categories.json .nojekyll; do
            if [ ! -e "_site/$f" ]; then
              echo "公開物に $f がありません。" >&2
              exit 1
            fi
          done

          echo "公開するファイル数: $(find _site -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
