# GitHub Pages へのデプロイ
#
# 唯一の防波堤である precheck.py を通らなければデプロイしない。
#
# 配信するのは「アプリの実体だけ」。リポジトリ直下をそのまま上げると、
# .claude/ 配下やルートの CLAUDE.md まで配信される（実測で 200 が返った）。
# 開発用のものは持ち込まない。下の「公開するものだけを集める」を参照。
#
# 前提: Settings → Pages → Source を「GitHub Actions」にしておくこと。
#       「Deploy from a branch」のままだとこのワークフローは失敗し、
#       かわりにブランチ直下がそのまま配信される（= precheck を通らない）。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/english-learning-app-plan-acnz6p
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # サプライチェーン対策としてコミットSHAで固定（Dependabot が更新を自動PR）
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 静的チェック（これを通らなければ公開しない）
        run: python3 .github/tools/precheck.py

      # enablement: true にしておくと、Pages が未設定でもこのアクションが
      # 有効化を試みる。リポジトリを public にすれば、次の push で
      # Settings を触らずに公開が始まる。
      # （無料プランでは private のままだと有効化できず、ここで失敗する）
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      # リポジトリ直下をそのまま上げると開発用のものまで配信される。
      # 許可したものだけを集める方式にして、増やし忘れではなく
      # 「入れ忘れ」で失敗する側に倒す。
      - name: 公開するものだけを集める
        run: |
          set -e
          rm -rf _site && mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll _site/
          cp -r css js icons data _site/

          # 開発用が混ざっていないことを機械で確かめる
          for f in .claude CLAUDE.md README.md .github .gitignore .git; do
            if [ -e "_site/$f" ]; then
              echo "公開物に $f が混ざっています。上の cp を見直してください。" >&2
              exit 1
            fi
          done

          # 起動に要るものが欠けていないことも確かめる
          for f in index.html sw.js manifest.webmanifest js/base.js js/main.js \
                   css/style.css data/categories.json .nojekyll; do
            if [ ! -e "_site/$f" ]; then
              echo "公開物に $f がありません。" >&2
              exit 1
            fi
          done

          echo "公開するファイル数: $(find _site -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
