# 静的チェックと、ブラウザでの通し確認。
#
# 依存パッケージはリポジトリに入れない（package.json を置かない）方針のため、
# Playwright は npx でその場限りに取得する。
# runner 標準の Python3 と Node だけで完結させている。
name: check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 静的チェック
        run: python3 tools/precheck.py

      - name: 書き込み範囲ガードの自己テスト
        run: python3 tools/guard_selftest.py

      - name: JS の構文チェック
        run: |
          set -e
          for f in $(find js sw.js -name '*.js' | sort); do
            node --check "$f"
          done
          echo "全 JS の構文 OK"

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npx playwright install はブラウザ本体を落とすだけで、playwright
      # パッケージ自体は入らない。require('playwright') を解決させるには
      # グローバルにパッケージも入れる必要がある。
      # （これを忘れて CI が MODULE_NOT_FOUND で落ちていた）
      - name: Playwright を取得
        run: |
          set -e
          # --with-deps は apt-get update を走らせる。runner 標準イメージには
          # Google Chrome の apt リポジトリが登録されているが、Playwright が使う
          # のは同梱の Chromium なので、このリポジトリは要らない。
          # 一方 apt-get update は1つでも壊れたリポジトリがあると全体が失敗する。
          # 実際、dl.google.com が Release と一致しない Packages.gz を配信して
          # 「Hash Sum mismatch」で CI が落ちた（こちらのコードとは無関係）。
          # 使わないものを外して、巻き添えを断つ。
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome-*.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npm install -g playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium
          NODE_PATH="$(npm root -g)" node -e "require('playwright')"
          echo "playwright を解決できました"

      # 通し確認とオフライン確認は同じサーバを使うので1ステップにまとめる。
      # ステップを分けるとバックグラウンドのサーバが残るかどうかに依存して
      # 不安定になる。
      - name: ブラウザで一周し、オフラインでも学習できることを確認する
        run: |
          set -e
          mkdir -p /tmp/site/eikAIwa
          # .git を含めると無駄に重いので除く
          tar --exclude=.git -cf - . | (cd /tmp/site/eikAIwa && tar -xf -)
          python3 -m http.server 8080 -d /tmp/site >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/eikAIwa/index.html && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://localhost:8080/eikAIwa/index.html \
            || { echo "ローカルサーバが起動しませんでした"; exit 1; }

          export NODE_PATH="$(npm root -g)"
          export SMOKE_URL=http://localhost:8080/eikAIwa/

          echo "── ブラウザ通し確認 ──"
          node tools/browser_smoke.js

          echo "── オフライン動作 ──"
          node tools/offline_test.js
